<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demo POS - PosCast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden">

    <!-- LAYAR WELCOME DEMO -->
    <div id="welcomeScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8 text-center relative">
            <div class="flex flex-col items-center justify-center mb-6">
                <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase mb-2">Powered By</p>
                <img src="image_892a1f.png" alt="PosCast Logo" class="h-12 object-contain" onerror="this.src='https://via.placeholder.com/150x50?text=PosCast'">
            </div>
            <h1 class="text-xl font-bold text-slate-800 mb-2">Interactive Demo</h1>
            <p class="text-slate-500 mb-6 text-sm">Jelajahi kemudahan kasir digital untuk UMKM Anda.</p>
            <button onclick="startDemo()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-xl transition">
                Mulai Coba Aplikasi
            </button>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="mainApp" class="hidden h-screen flex flex-col md:flex-row">
        
        <!-- NAVIGASI -->
        <nav class="bg-white border-t md:border-t-0 md:border-r border-slate-200 w-full md:w-20 lg:w-64 h-16 md:h-full fixed bottom-0 md:relative z-40 flex md:flex-col justify-between md:justify-start shadow-[0_-4px_10px_rgba(0,0,0,0.05)] md:shadow-none">
            <div class="hidden md:flex flex-col items-center lg:items-start gap-1 p-4 lg:p-6 border-b border-slate-100">
                <img src="image_892a1f.png" alt="PosCast" class="h-6 object-contain hidden lg:block" onerror="this.style.display='none'">
                <span class="font-bold text-lg lg:hidden">PC</span>
            </div>
            
            <div class="flex md:flex-col w-full px-2 py-2 md:py-6 gap-2">
                <button onclick="switchTab('pos')" class="nav-btn text-blue-600 bg-blue-50 flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 p-2 lg:p-3 rounded-xl lg:mx-4 transition">
                    <i class="ph-bold ph-calculator text-2xl"></i><span class="text-[10px] md:text-xs lg:text-sm font-semibold lg:block">Kasir</span>
                </button>
                <button onclick="switchTab('inventory')" class="nav-btn text-slate-500 flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 p-2 lg:p-3 rounded-xl lg:mx-4 transition">
                    <i class="ph-bold ph-package text-2xl"></i><span class="text-[10px] md:text-xs lg:text-sm font-semibold lg:block">Inventaris</span>
                </button>
                <button onclick="switchTab('management')" class="nav-btn text-slate-500 flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 p-2 lg:p-3 rounded-xl lg:mx-4 transition">
                    <i class="ph-bold ph-chart-bar text-2xl"></i><span class="text-[10px] md:text-xs lg:text-sm font-semibold lg:block">Manajemen</span>
                </button>
            </div>
        </nav>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 flex flex-col h-[calc(100vh-4rem)] md:h-screen w-full relative bg-slate-50">
            
            <!-- TAB: KASIR -->
            <div id="tab-pos" class="tab-content flex-1 flex flex-col md:flex-row w-full h-full">
                <div class="flex-1 p-4 flex flex-col h-full overflow-hidden">
                    <h2 class="text-xl font-bold mb-4 text-slate-800">Menu Produk</h2>
                    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 overflow-y-auto no-scrollbar pb-24">
                        <div class="col-span-full text-center text-slate-400 py-10">Memuat data demo...</div>
                    </div>
                </div>

                <!-- Keranjang -->
                <div class="w-full md:w-80 bg-white border-l border-slate-200 h-full flex flex-col shadow-lg z-30">
                    <div class="p-4 border-b border-slate-100 font-bold flex justify-between items-center text-slate-800">
                        Keranjang <button onclick="cart=[] ; renderCart()" class="text-xs text-red-500 font-normal hover:underline">Kosongkan</button>
                    </div>
                    <div id="cartContainer" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 pb-24 md:pb-4"></div>
                    <div class="p-4 bg-slate-50 border-t border-slate-200 pb-24 md:pb-4">
                        <div class="flex justify-between font-bold text-lg mb-4">
                            <span>Total</span><span id="cartTotal" class="text-blue-600">Rp 0</span>
                        </div>
                        <button onclick="checkout()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow-md transition">Proses Transaksi</button>
                    </div>
                </div>
            </div>

            <!-- TAB: INVENTARIS -->
            <div id="tab-inventory" class="tab-content hidden flex-1 p-4 md:p-6 overflow-y-auto pb-24">
                <h2 class="text-2xl font-bold mb-4 text-slate-800">Stok Barang</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr><th class="p-4">Nama Produk</th><th class="p-4">Harga</th><th class="p-4 text-center">Stok</th></tr>
                        </thead>
                        <tbody id="inventoryTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: MANAJEMEN (DASHBOARD BARU) -->
            <div id="tab-management" class="tab-content hidden flex-1 p-4 md:p-6 overflow-y-auto pb-24">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Manajemen Usaha</h2>
                
                <!-- Stat Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-sm font-semibold text-slate-500 mb-1">Total Omzet</p>
                        <h3 class="text-3xl font-bold text-blue-600" id="dashOmzet">Rp 0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-sm font-semibold text-slate-500 mb-1">Total Transaksi</p>
                        <h3 class="text-3xl font-bold text-slate-800" id="dashTrx">0</h3>
                    </div>
                </div>

                <!-- Riwayat Transaksi -->
                <h3 class="text-lg font-bold mb-3 text-slate-800">Riwayat Terakhir</h3>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
                            <tr><th class="p-4">Waktu</th><th class="p-4">ID Transaksi</th><th class="p-4 text-right">Nilai</th></tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbziaocZuJeWEHi_GpIQ1j9CUFQM54ztsBr6rRD-QtbUt6K3IaKqV4PvWdJglXTtesjs/exec';
        let allProducts = [], cart = [];

        function formatRp(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function startDemo() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            fetchData();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-600', 'bg-blue-50'); btn.classList.add('text-slate-500');
            });
            event.currentTarget.classList.remove('text-slate-500'); event.currentTarget.classList.add('text-blue-600', 'bg-blue-50');
            
            // Refresh data diam-diam jika masuk manajemen
            if(tabId === 'management') fetchData(true);
        }

        async function fetchData(silent = false) {
            try {
                const res = await fetch(API_URL);
                const result = await res.json();
                if(result.status === 'success') {
                    allProducts = result.data;
                    if(!silent) {
                        renderProducts();
                        renderInventory();
                    }
                    // Render Dashboard
                    document.getElementById('dashOmzet').innerText = formatRp(result.dashboard.omzet);
                    document.getElementById('dashTrx').innerText = result.dashboard.totalTrx;
                    
                    const hBody = document.getElementById('historyTableBody');
                    hBody.innerHTML = '';
                    if(result.dashboard.history.length === 0) hBody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada transaksi</td></tr>';
                    
                    result.dashboard.history.forEach(h => {
                        hBody.innerHTML += `
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 text-xs text-slate-500">${h.waktu.split(' ')[1]}</td>
                                <td class="p-4 font-mono text-xs text-slate-700">${h.idTrx}</td>
                                <td class="p-4 text-right font-bold text-blue-600">${formatRp(h.total)}</td>
                            </tr>`;
                    });
                }
            } catch (err) {
                if(!silent) document.getElementById('productGrid').innerHTML = `<div class="col-span-full text-red-500 text-center">Gagal memuat API Demo.</div>`;
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            allProducts.forEach(p => {
                grid.innerHTML += `
                    <div onclick="addToCart('${p.id}')" class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 cursor-pointer hover:border-blue-400 transition flex flex-col justify-between h-32 relative overflow-hidden">
                        <div class="relative z-10">
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">${p.kategori}</p>
                            <h3 class="font-bold text-sm leading-tight line-clamp-2 text-slate-800">${p.nama}</h3>
                        </div>
                        <p class="text-blue-600 font-bold text-sm md:text-base relative z-10">${formatRp(p.harga)}</p>
                    </div>`;
            });
        }

        function renderInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            allProducts.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold text-slate-700">${p.nama} <br><span class="text-xs text-slate-400 font-normal">${p.kategori}</span></td>
                        <td class="p-4">${formatRp(p.harga)}</td>
                        <td class="p-4 text-center"><span class="bg-slate-100 px-3 py-1 rounded-full text-xs font-bold">${p.stok}</span></td>
                    </tr>`;
            });
        }

        function addToCart(id) {
            const p = allProducts.find(x => String(x.id) === String(id));
            const item = cart.find(x => String(x.id) === String(id));
            if (item) item.qty++; else cart.push({ id: p.id, nama: p.nama, harga: p.harga, qty: 1 });
            renderCart();
        }

        function renderCart() {
            const cc = document.getElementById('cartContainer');
            cc.innerHTML = '';
            let total = 0;
            if(cart.length === 0) cc.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-sm text-slate-400">Keranjang kosong</p></div>`;
            cart.forEach((item, index) => {
                total += (item.harga * item.qty);
                cc.innerHTML += `
                    <div class="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                        <div class="flex-1"><p class="font-bold text-slate-800 line-clamp-1">${item.nama}</p><p class="text-blue-600">${formatRp(item.harga)}</p></div>
                        <div class="flex items-center gap-2 bg-slate-100 rounded-lg px-2 py-1">
                            <button onclick="cart[${index}].qty--; if(cart[${index}].qty<=0) cart.splice(${index},1); renderCart()" class="text-slate-500 hover:text-slate-800 font-bold px-2">-</button>
                            <span class="w-4 text-center font-bold">${item.qty}</span>
                            <button onclick="cart[${index}].qty++; renderCart()" class="text-slate-500 hover:text-slate-800 font-bold px-2">+</button>
                        </div>
                    </div>`;
            });
            document.getElementById('cartTotal').innerText = formatRp(total);
            document.getElementById('cartTotal').dataset.val = total;
        }

        async function checkout() {
            if(cart.length === 0) return Swal.fire('Kosong', 'Keranjang belum terisi', 'warning');
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            const payload = { total: document.getElementById('cartTotal').dataset.val, metode: 'Cash', cart: cart };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === 'success') {
                    Swal.fire('Sukses!', 'Transaksi berhasil masuk ke sistem.', 'success');
                    cart = []; renderCart();
                    fetchData(true); // Update data dashboard di latar belakang
                }
            } catch (err) { Swal.fire('Error', 'Gagal memproses ke database.', 'error'); }
        }
    </script>
</body>
</html>
